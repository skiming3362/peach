# amane 桥的独立清单（ADR-0043）。amane 的传递依赖由本目录的 `uv.lock` 完整锁定，
# 独立于 Peach 主 venv。桌面与 Docker 在构建时准备随包环境；源码部署在数据目录按锁准备。
#
# 唯一直接依赖是 amane 的一个 revision。升级是人做的事：改这里的 sha，跑
# `uv lock --project tools/amane-bridge`，读上游 diff 确认站点解析器的字段语义没变，
# 再同批更新 `docs/REUSE.md` 与 `src/peach/metadata_amane.py` 的复核记录。
[project]
name = "peach-amane-bridge"
version = "0.1.0"
description = "Peach 调用 amane 刮削站点的薄桥子进程"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "amane @ git+https://github.com/sqzw-x/amane@ffaedbcdfa170c158bf457128f534f5b59365ec7",
]

[tool.uv]
# 桥不是一个包，只有一个脚本；uv 只管 venv 与锁。
package = false
# 上游从 v0.27 起把语义检索的模型运行时列为硬依赖，只有 `amane.semantic` 与 `amane.db.embeddings`
# 导入它们；桥只走爬虫层与网络层，把它们排除在锁外。
exclude-dependencies = ["numpy", "onnxruntime", "tokenizers", "pyobjc-framework-coreml"]
